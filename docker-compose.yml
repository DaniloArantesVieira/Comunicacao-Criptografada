services:
  ca:
    build: ./ca
    container_name: ca
    volumes:
      - certs:/certs

  server:
    build: ./server
    container_name: server
    depends_on:
      ca:
        condition: service_completed_successfully
    volumes:
      - certs:/certs
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "1194:1194/udp"
    healthcheck:
      test: ["CMD-SHELL", "ip addr show tun0 | grep -q '10.8.0.1/24'"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  client_norte:
    build: ./client
    container_name: client_norte
    environment:
      CLIENT_NAME: cliente_norte
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - certs:/certs
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    healthcheck:
      test: ["CMD-SHELL", "ip addr show tun0 | grep -q '10.8.0.2/24'"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  client_sul:
    build: ./client
    container_name: client_sul
    environment:
      CLIENT_NAME: cliente_sul
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - certs:/certs
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    healthcheck:
      test: ["CMD-SHELL", "ip addr show tun0 | grep -q '10.8.0.3/24'"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  app_server:
    build: ./app
    container_name: app_server
    network_mode: "service:client_sul"
    depends_on:
      client_sul:
        condition: service_healthy
    command: ["python", "message_server.py"]

  app_client:
    build: ./app
    container_name: app_client
    network_mode: "service:client_norte"
    environment:
      APP_SERVER_HOST: "10.8.0.3"
    depends_on:
      client_norte:
        condition: service_healthy
      app_server:
        condition: service_started
    command: ["python", "message_client.py"]

volumes:
  certs: